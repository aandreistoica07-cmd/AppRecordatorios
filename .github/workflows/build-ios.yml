name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  APP_NAME: "Rutinas"
  BUNDLE_ID: "com.rutinas.recordatorios"
  XCODE_PATH: "/Applications/Xcode_26.6.app/Contents/Developer"

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA (macOS 26 / Xcode 26 / iOS 26 SDK)
    # Verificado en actions/runner-images: macos-26 (macOS 26.6.2 Arm64 Tahoe)
    # incluye Xcode 26.6 (por defecto) con el SDK iphoneos26.5 (iOS 26).
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          elif [ -d "/Applications/Xcode_26.5.app/Contents/Developer" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"
          else
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle (Vite + TypeScript)
        run: npm run build

      - name: Ensure Capacitor iOS platform exists
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Apply custom dark icon and splash screen (from assets/)
        run: |
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          SPLASH_DIR="ios/App/App/Assets.xcassets/Splash.imageset"
          if [ -f "assets/icon.png" ]; then
            sips -s format png -z 1024 1024 "assets/icon.png" --out "$ICON_DEST"
          fi
          if [ -f "assets/splash.png" ]; then
            sips -s format png -z 2732 2732 "assets/splash.png" --out "$SPLASH_DIR/splash-2732x2732.png"
            cp "$SPLASH_DIR/splash-2732x2732.png" "$SPLASH_DIR/splash-2732x2732-1.png"
            cp "$SPLASH_DIR/splash-2732x2732.png" "$SPLASH_DIR/splash-2732x2732-2.png"
          fi

      - name: Cache native iOS dependencies (CocoaPods & DerivedData)
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
            ios/DerivedData
          key: ${{ runner.os }}-ios-native-${{ hashFiles('ios/App/Podfile', 'ios/App/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-native-

      - name: Sync Capacitor iOS project & CocoaPods
        run: |
          npx cap sync ios
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            cd ios/App && pod install
          fi

      - name: Archive iOS App without code signing
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "ios/DerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            INFOPLIST_KEY_CFBundleDisplayName="$APP_NAME" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned .ipa (Payload folder)
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload Rutinas-unsigned.ipa
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" Payload/App.app
          zip -r -9 "$GITHUB_WORKSPACE/Rutinas-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Rutinas-unsigned.ipa"

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rutinas-unsigned-ipa
          path: Rutinas-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

env:
  APP_NAME: "Rutinas"
  BUNDLE_ID: "com.rutinas.recordatorios"
  XCODE_PATH: "/Applications/Xcode_26.6.app/Contents/Developer"

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA (macOS 26 / Xcode 26 / iOS 26 SDK)
    # Verificado en actions/runner-images: macos-26 (macOS 26.6.2 Arm64 Tahoe)
    # incluye Xcode 26.6 (por defecto) con el SDK iphoneos26.5 (iOS 26).
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          elif [ -d "/Applications/Xcode_26.5.app/Contents/Developer" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"
          else
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle (Vite + TypeScript)
        run: npm run build

      - name: Ensure Capacitor iOS platform exists
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Apply custom dark icon and splash screen (from assets/)
        run: |
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          SPLASH_DIR="ios/App/App/Assets.xcassets/Splash.imageset"
          if [ -f "assets/icon.png" ]; then
            sips -s format png -z 1024 1024 "assets/icon.png" --out "$ICON_DEST"
          fi
          if [ -f "assets/splash.png" ]; then
            sips -s format png -z 2732 2732 "assets/splash.png" --out "$SPLASH_DIR/splash-2732x2732.png"
            cp "$SPLASH_DIR/splash-2732x2732.png" "$SPLASH_DIR/splash-2732x2732-1.png"
            cp "$SPLASH_DIR/splash-2732x2732.png" "$SPLASH_DIR/splash-2732x2732-2.png"
          fi

      - name: Cache native iOS dependencies (CocoaPods)
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: v2-${{ runner.os }}-ios-pods-${{ hashFiles('ios/App/Podfile', 'ios/App/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            v2-${{ runner.os }}-ios-pods-

      - name: Sync Capacitor iOS project & CocoaPods
        run: |
          npx cap sync ios
          cd ios/App && pod install

      - name: Archive iOS App without code signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "ios/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          echo "=== Últimas 80 líneas de xcodebuild.log ==="
          tail -n 80 "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Show tail of xcodebuild.log on failure
        if: failure()
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            echo "=== ERRORES DETECTADOS EN XCODEBUILD ==="
            grep -E "error:|fatal error:|warning:.*AlarmKit" "$GITHUB_WORKSPACE/xcodebuild.log" || true
            echo "=== ÚLTIMAS 120 LÍNEAS DE XCODEBUILD.LOG ==="
            tail -n 120 "$GITHUB_WORKSPACE/xcodebuild.log"
          fi

      - name: Upload xcodebuild.log artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Package unsigned .ipa (Payload folder) & verify unique Bundle IDs
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload Rutinas-unsigned.ipa
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" Payload/App.app

          # Asegurar que ningún framework embebido comparta CFBundleIdentifier con App.app ni entre sí
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "Payload/App.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "Payload/App.app/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "Payload/App.app/Info.plist"

          if [ -d "Payload/App.app/Frameworks" ]; then
            for fw in Payload/App.app/Frameworks/*.framework; do
              [ -d "$fw" ] || continue
              fw_name=$(basename "$fw" .framework)
              fw_plist="$fw/Info.plist"
              if [ -f "$fw_plist" ]; then
                clean_name=$(echo "$fw_name" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
                unique_fw_id="${BUNDLE_ID}.fw.${clean_name}"
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $unique_fw_id" "$fw_plist"
                echo "Framework $fw_name -> CFBundleIdentifier = $unique_fw_id"
              fi
            done
          fi

          zip -r -9 "$GITHUB_WORKSPACE/Rutinas-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Rutinas-unsigned.ipa"

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rutinas-unsigned-ipa
          path: Rutinas-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
